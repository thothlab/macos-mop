[package]
name = "mop"
version = "0.1.0"
edition = "2021"
description = "Fast macOS system cleaner"
license = "MIT"
repository = "https://github.com/thothlab/macos-mop"
readme = "README.md"
keywords = ["macos", "cleaner", "system", "cache", "mop"]
categories = ["command-line-utilities"]

[[bin]]
name = "mop"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
rayon = "1"
indicatif = "0.17"
console = "0.15"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
sysinfo = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
chrono = "0.4"
bytesize = "2"
log = "0.4"
env_logger = "0.11"
plist = "1"
anyhow = "1"
once_cell = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
